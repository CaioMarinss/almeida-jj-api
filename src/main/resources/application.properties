spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.schema=almeidajj
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA properties removed to use plain JDBC (Hibernate/JPA not on classpath)
# If you need schema settings for JDBC, keep spring.datasource.hikari.schema and/or use SET search_path on init.
spring.sql.init.continue-on-error=true
spring.datasource.initialization-mode=always

api.security.token.secret=${TOKEN_SECRET}
spring.config.use-legacy-processing=true

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS: origens permitidas.
app.cors.allowed-origins=${URL_FRONTEND}
